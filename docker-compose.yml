services:
  mongodb:
    image: mongo:7.0
    container_name: revhub-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: revhub
    volumes:
      - mongodb_data:/data/db
    networks:
      - revhub-network

  mysql:
    image: mysql:8.0
    container_name: revhub-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: revhub
      MYSQL_USER: revhub
      MYSQL_PASSWORD: revhub123
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - revhub-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  revhub-app:
    build: .
    container_name: revhub-app
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_started
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_MONGODB_URI: mongodb://revhub-mongodb:27017/revhub
    networks:
      - revhub-network

volumes:
  mongodb_data:
  mysql_data:

networks:
  revhub-network:
    driver: bridge